name: Captum Lint

on:
  pull_request:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  tests:
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    with:
      runner: mt-l-x86iavx512-48-384
      docker-image: python:3.11
      script: |
        ./scripts/install_via_pip.sh
        ufmt check . || (ufmt diff . && exit 1)
        flake8
        sphinx-build -WT --keep-going sphinx/source sphinx/build
