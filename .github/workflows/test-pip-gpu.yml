name: Unit-tests for Pip install

on:
  pull_request:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  tests:
    strategy:
      matrix:
        cuda_arch_version: ["12.6"]
      fail-fast: false
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    with:
      timeout: 60
      runner: mt-l-x86iavx512-29-115-t4
      gpu-arch-type: cuda
      gpu-arch-version: ${{ matrix.cuda_arch_version }}
      hf-cache: false
      script: |
        # OSDC runners set HF_HOME to a read-only shared cache; the tests download models from the Hub.
        export HF_HOME="${RUNNER_TEMP}/hf_home"
        # OSDC runners add a CPU-only torch index through PIP_EXTRA_INDEX_URL, which can win over cu126.
        unset PIP_EXTRA_INDEX_URL
        python3 -m pip install --upgrade pip --progress-bar off
        python3 -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cu126 --progress-bar off
        python3 -m pip install -e .[dev] --extra-index-url https://download.pytorch.org/whl/cu126 --progress-bar off
        python3 -m pip install transformers --progress-bar off
        python3 -c 'import torch; assert torch.cuda.is_available() and torch.version.cuda, torch.__version__'

        # Build package
        python3 -m pip install build --progress-bar off
        python3 -m build

        # Run Tests
        python3 -m pytest -ra --cov=. --cov-report term-missing
